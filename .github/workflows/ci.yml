name: CI

on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: 'Gradle test task selector (e.g. test --tests FooTest); empty runs the full suite'
        required: false
        default: ''

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      matrix:
        java: [ 8, 11, 17, 18 ]
    name: Test JDK ${{ matrix.java }}
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-java@v2
        with:
          java-version: ${{ matrix.java }}
          java-package: 'jdk'
          distribution: 'temurin'
      - name: Test count init script
        run: |
          cat > "$RUNNER_TEMP/test-count.gradle" <<'INIT'
          allprojects {
              tasks.withType(Test) {
                  testLogging {
                      events 'skipped', 'failed'
                      exceptionFormat 'full'
                  }
                  afterSuite { desc, result ->
                      if (desc.parent == null) {
                          println("TEST SUMMARY [${project.path}:${name}]: ${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped")
                      }
                  }
              }
          }
          INIT
      - name: Build
        uses: gradle/gradle-build-action@v2
        with:
          arguments: ${{ inputs.test-filter != '' && format('assemble {0}', inputs.test-filter) || 'build' }} -x checkstyleMain -x checkstyleTest -x checkstyleRegressionTest -I ${{ runner.temp }}/test-count.gradle --console=plain
      - name: Jacoco
        uses: gradle/gradle-build-action@v2
        with:
          arguments: jacocoTestReport
      - uses: codecov/codecov-action@v2
        if: false
      - name: Build release jar
        if: matrix.java == '8'
        uses: gradle/gradle-build-action@v2
        with:
          arguments: jar --console=plain
      - name: List built jars
        if: matrix.java == '8'
        run: ls -la build/libs
      - uses: actions/upload-artifact@v4
        if: matrix.java == '8'
        with:
          name: junrar-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
            !build/libs/*-javadoc.jar
          if-no-files-found: error

  release:
    name: semantic release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test
    if: false
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v2
        with:
          node-version: '16'
          cache: 'npm'
      - uses: actions/setup-java@v2
        with:
          java-version: '8'
          java-package: 'jdk'
          distribution: 'temurin'
          cache: 'gradle'
      - name: Install dependencies
        run: npm ci --omit=dev --ignore-scripts
      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ORG_GRADLE_PROJECT_signingKey: ${{ secrets.GPG_KEY }}
          ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.GPG_PASSPHRASE }}
          ORG_GRADLE_PROJECT_sonatypeUsername: ${{ secrets.MAVENCENTRAL_USER }}
          ORG_GRADLE_PROJECT_sonatypePassword: ${{ secrets.MAVENCENTRAL_PASSWORD }}
        run: npx semantic-release
